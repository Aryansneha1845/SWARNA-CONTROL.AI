# Render Blueprint — SWARN-CONTROL.AI backend (FastAPI, free tier).
# Usage: Render Dashboard -> New -> Blueprint -> select this repo.
# Then set the env vars below (Dashboard -> Environment). Never commit real keys.
services:
  - type: web
    name: swarn-control-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is injected by Render. Single worker: slowapi limiter is in-memory.
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: ETH_RPC_URL
        value: https://rpc.ankr.com/eth
      # Set these in the Dashboard (sync: false = manual, never in git):
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SWARN_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
